name: Publier les exécutables sur Google Drive
description: Archive les exécutables dans le dossier Google Drive fourni et publie leur lien sur la Release GitHub.
inputs:
  credentials:
    description: JSON OAuth du compte Google propriétaire du dossier.
    required: false
  folder-id:
    description: Identifiant ou lien du dossier Google Drive existant.
    required: false
  version:
    description: Numéro de version publié.
    required: true
  artifact-dir:
    description: Dossier contenant les exécutables vérifiés.
    required: true
  github-token:
    description: Token permettant de mettre à jour la Release du dépôt courant.
    required: true
outputs:
  folder-url:
    description: Lien du dossier de cette version sur Google Drive.
    value: ${{ steps.publish.outputs.folder-url }}
runs:
  using: composite
  steps:
    - name: Vérifier la configuration Drive
      id: config
      shell: bash
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ inputs.credentials }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ inputs.folder-id }}
      run: |
        if [ -z "$GOOGLE_DRIVE_CREDENTIALS" ] || [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Google Drive n’est pas encore activé : configurez le secret GOOGLE_DRIVE_CREDENTIALS et la variable GOOGLE_DRIVE_FOLDER_ID du dépôt." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-node@v4
      if: steps.config.outputs.enabled == 'true'
      with:
        node-version: 22
    - name: Publier les exécutables
      id: publish
      if: steps.config.outputs.enabled == 'true'
      shell: bash
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ inputs.credentials }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ inputs.folder-id }}
        DRIVE_VERSION: ${{ inputs.version }}
        DRIVE_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/publish-google-drive.mjs"
