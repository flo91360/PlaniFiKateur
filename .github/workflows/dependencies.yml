name: Dépendances
# Contrôle hebdomadaire : une vulnérabilité publiée après coup ou une image de base qui casse la
# construction apparaît dans Actions, avec l’e-mail d’échec de GitHub. Pour chaque PR et chaque push
# sur main, les mêmes contrôles font partie du job requis « Tests serveur » (ci.yml) dès que les
# dépendances, le worker ou le déploiement changent.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Site et worker
        run: scripts/dependency-checks.sh audit
  image:
    name: Image du worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Construire l’image
        run: scripts/dependency-checks.sh worker-image
  site:
    name: Image du site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Construire et démarrer l’image
        run: scripts/dependency-checks.sh site-image
