name: Fusion des PR agent
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
concurrency:
  group: agent-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted main branch only: never execute a PR's code with this token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Vérifier la configuration du mécanisme complémentaire
        id: configuration
        env:
          PLANIFIKATEUR_URL: ${{ secrets.PLANIFIKATEUR_URL }}
          PLANIFIKATEUR_AGENT_TOKEN: ${{ secrets.PLANIFIKATEUR_AGENT_TOKEN }}
        run: |
          if [ -n "$PLANIFIKATEUR_URL" ] && [ -n "$PLANIFIKATEUR_AGENT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fusion confiée au worker : aucun secret Actions supplémentaire requis."
          fi
      - name: Fusion complémentaire via GitHub Actions
        if: steps.configuration.outputs.enabled == 'true'
        run: node scripts/merge-agent-pr.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          PLANIFIKATEUR_URL: ${{ secrets.PLANIFIKATEUR_URL }}
          PLANIFIKATEUR_AGENT_TOKEN: ${{ secrets.PLANIFIKATEUR_AGENT_TOKEN }}
