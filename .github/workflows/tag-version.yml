name: Tag de version
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tag-version
  cancel-in-progress: false
jobs:
  tag:
    name: Créer le tag de la version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer et pousser v<version> s’il n’existe pas
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide dans package.json : ${version}"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Le tag ${tag} existe déjà."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          echo "Tag ${tag} créé sur ${GITHUB_SHA}."
