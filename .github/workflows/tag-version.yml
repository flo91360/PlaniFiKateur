name: Livraison de version
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: livraison-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publier le tag après les tests
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Vérifier les contrôles et publier le tag immuable
        run: node scripts/publish-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
      - name: Lire la version publiée
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
  deploy:
    name: Vérifier le déploiement Railway
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Attendre la version et le commit livrés sur le site
        run: node scripts/verify-deployment.mjs
        env:
          PLANIFIKATEUR_URL: ${{ vars.PLANIFIKATEUR_URL || 'https://planifikateur-production.up.railway.app' }}
          DELIVERY_SHA: ${{ github.event.workflow_run.head_sha }}
          DELIVERY_VERSION: ${{ needs.publish.outputs.version }}
